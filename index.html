<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVE News</title>
    <link rel="stylesheet" href="style.css">
    <script src="./main.js" type="module" defer></script>
</head>
<body>

    <header>
        <div class="logo">
            <h2>MY CVE</h2>
        </div>
        <nav>
            <div class="search">
                <input id="search" class="search-input" type="text">
                <button id="search-btn">Search</button>
            </div>
        </nav>
    </header>

    <main>
        <div class="sidebar">
            <h2>Greetings Hacker</h2>

            <div class="side-panel">
                <h2>Top News</h2>
                <div class="news-feed">
                    <h3>Loading...</h3>
                    <p>Loading...</p>
                </div>

            </div>
        </div>
        <section class="container-parent">
            <h2 class="main-header" id="resultsTitle">
                Recent CVEs
            </h2>
            <div class="container" id="container">
                <div class="card">
                    <h3>Loading...</h3>
                    <h4>Loading...</h4>
                    <p>Loading...</p>
                </div>
            </div>
            <div class="pages">
            <p><b id="pagerTitle">Page ... of ...</b></p>
            <div id="pages">
                <button class="posButton">...</button>
            </div>
            
        </div>
        </section>
    </main>
    
</body>
</html>
